apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: database
spec:
  replicas: 1
  # Un PVC ReadWriteOnce solo puede montarse en un pod a la vez, así que un
  # rolling update (donde el pod viejo y el nuevo coexisten brevemente) se
  # quedaría atascado.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          envFrom:
            - secretRef:
                name: mariadb-credenciales
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: datos
              mountPath: /var/lib/mysql
      volumes:
        - name: datos
          persistentVolumeClaim:
            claimName: mariadb-datos
