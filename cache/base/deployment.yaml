apiVersion: apps/v1
kind: Deployment
metadata:
  name: ideas-creativas-cache
  labels:
    app.kubernetes.io/name: ideas-creativas-cache
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ideas-creativas-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ideas-creativas-cache
        app.kubernetes.io/component: cache
    spec:
      containers:
        # Valkey es el fork open-source (Linux Foundation) de Redis; habla
        # el mismo protocolo RESP, así que el cliente go-redis de la app
        # funciona contra él sin cambios. Cambia la imagen a redis:7-alpine
        # si necesitas específicamente el Redis original.
        - name: valkey
          image: valkey/valkey:8-alpine
          args: ["valkey-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: valkey
              containerPort: 6379
