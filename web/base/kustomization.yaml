apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# ConfigMap generado (con sufijo hash): cada cambio en estos valores produce
# un nombre de ConfigMap nuevo, que Kustomize reescribe automáticamente en
# la referencia envFrom del Deployment, forzando un rolling restart para
# tomarlo. Cada overlay añade sus propios valores del entorno con behavior=merge.
configMapGenerator:
  - name: ideas-creativas-api-configuracion
    literals:
      - PORT=8080
      - LOG_LEVEL=info
      - CACHE_TTL_SECONDS=30
      - SHUTDOWN_TIMEOUT_SECONDS=10
