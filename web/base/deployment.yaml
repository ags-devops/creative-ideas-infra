apiVersion: apps/v1
kind: Deployment
metadata:
  name: ideas-creativas-api
  labels:
    app.kubernetes.io/name: ideas-creativas-api
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ideas-creativas-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ideas-creativas-api
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: api
          # Sin etiqueta a propósito: cada overlay fija la versión con `images:`.
          image: ghcr.io/ags-devops/creative-ideas-api:v0.2.1
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ideas-creativas-api-configuracion
          # DB_DSN / REDIS_PASSWORD llegan desde un Secret propio de cada
          # entorno, añadido por cada overlay (nunca se commitea en texto plano aquí).
          volumeMounts:
            - name: datos
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          # Da tiempo a que terminen las peticiones en curso antes de
          # SIGTERM durante un rolling update o un scale-down (12-factor "Disposability").
          lifecycle:
            preStop:
              sleep:
                seconds: 3
      terminationGracePeriodSeconds: 15
      volumes:
        - name: datos
          emptyDir: {}
