apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ideas-creativas-prod

resources:
  - namespace.yaml
  - ../../base

patches:
  - path: deployment-patch.yaml

replicas:
  - name: ideas-creativas-api
    count: 5

configMapGenerator:
  - name: ideas-creativas-api-configuracion
    behavior: merge
    literals:
      - APP_ENV=production
      - DB_DRIVER=mysql
      - REDIS_ADDR=ideas-creativas-cache:6379

# CAMBIA la contraseña de abajo antes de aplicar esto en un clúster real, y
# usa un gestor de secretos de verdad (Sealed Secrets, External Secrets
# Operator, SOPS) en vez de literales planos para producción.
secretGenerator:
  - name: ideas-creativas-api-secreto
    literals:
      - DB_DSN=app:CHANGE_ME_APP_PASSWORD@tcp(mariadb-prod:3306)/ideas_creativas?parseTime=true
      - REDIS_PASSWORD=

images:
  - name: ghcr.io/ags-devops/creative-ideas-api
    newTag: v0.2.0
